<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Aircraft silhouette (tilted for dynamic look) -->
  <g transform="translate(32,32) rotate(-35) translate(-32,-32)">
    <!-- Fuselage -->
    <path d="M16 32 C16 29, 20 26, 28 25 L48 24 C52 23.5, 54 26, 54 32 C54 38, 52 40.5, 48 40 L28 39 C20 38, 16 35, 16 32 Z" fill="url(#plane)" opacity="0.95"/>
    <!-- Left wing -->
    <path d="M30 25 L24 12 C23.5 10.5, 25 10, 26 11 L34 24Z" fill="url(#plane)" opacity="0.9"/>
    <!-- Right wing -->
    <path d="M30 39 L24 52 C23.5 53.5, 25 54, 26 53 L34 40Z" fill="url(#plane)" opacity="0.9"/>
    <!-- Tail fin top -->
    <path d="M48 25 L52 16 C52.5 14.5, 54 15, 54 16.5 L52 25Z" fill="url(#plane)" opacity="0.85"/>
    <!-- Tail fin bottom -->
    <path d="M48 39 L52 48 C52.5 49.5, 54 49, 54 47.5 L52 39Z" fill="url(#plane)" opacity="0.85"/>
    <!-- Cockpit window -->
    <ellipse cx="20" cy="32" rx="2.5" ry="1.8" fill="#0ea5e9" opacity="0.7"/>
    <!-- Engine glow line -->
    <line x1="14" y1="32" x2="8" y2="32" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="12" y1="30" x2="7" y2="29" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
    <line x1="12" y1="34" x2="7" y2="35" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
